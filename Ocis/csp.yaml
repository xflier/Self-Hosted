directives:
  child-src:
    - '''self'''
  connect-src:
    - '''self'''
    - 'blob:'
    - 'https://${COMPANION_DOMAIN|companion.self.test}/'
    - 'wss://${COMPANION_DOMAIN|companion.self.test}/'
    - 'https://raw.githubusercontent.com/owncloud/awesome-ocis/'
    # In contrary to bash and docker the default is given after the | character
    - 'https://${KEYCLOAK_DOMAIN|keycloak.self.test}/'
    # Photo-addon: OpenStreetMap tile requests
    - 'https://*.tile.openstreetmap.org'
  default-src:
    - '''none'''
  font-src:
    - '''self'''
    - 'data:'
  frame-ancestors:
    - '''self'''
  frame-src:
    - '''self'''
    - 'blob:'
    - 'https://embed.diagrams.net/'
    # In contrary to bash and docker the default is given after the | character
    - 'https://${ONLYOFFICE_DOMAIN|onlyoffice.self.test}/'
    - 'https://${COLLABORA_DOMAIN|collabora.self.test}/'
    # This is needed for the external-sites web extension when embedding sites
    - 'https://owncloud.dev'
  img-src:
    - '''self'''
    - 'data:'
    - 'blob:'
    - 'https://raw.githubusercontent.com/owncloud/awesome-ocis/'
    # In contrary to bash and docker the default is given after the | character
    - 'https://${ONLYOFFICE_DOMAIN|onlyoffice.self.test}/'
    - 'https://${COLLABORA_DOMAIN|collabora.self.test}/'
    # Photo-addon: OpenStreetMap tiles for map view
    - 'https://*.tile.openstreetmap.org'
  manifest-src:
    - '''self'''
  media-src:
    - '''self'''
  object-src:
    - '''self'''
    - 'blob:'
  script-src:
    - '''self'''
    - '''unsafe-inline'''
    - '''unsafe-eval'''
  style-src:
    - '''self'''
    - '''unsafe-inline'''