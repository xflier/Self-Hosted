services:
  onlyoffice:
    image: ${ONLYOFFICE_IMAGE:?Variable is not set}
    restart: unless-stopped
    container_name: onlyoffice
    user: ${UID:?Variable is not set}:${GID:?Variable is not set}
    environment:
      - DB_TYPE=postgres
      - DB_HOST=${POSTGRES_DB:?Variable is not set}
      # - DB_PORT=${MARIA_DB_PORT:?Variable is not set}
      - DB_USER=${ONLYOFFICE_DB_USER:?Variable is not set or empty}
      - DB_PWD=${ONLYOFFICE_DB_PASSWORD:?Variable is not set or empty}
      - DB_NAME=${ONLYOFFICE_DB_NAME:?Variable is not set}
      - WOPI_ENABLED=true
      - JWT_ENABLED=true
      - JWT_SECRET=${JWT_PRIVATE_KEY:?Variable is not set}
      - ALLOW_META_IP_ADDRESS=true
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - USE_UNAUTHORIZED_STORAGE=true
      # - REDIS_ENABLED=true
      # - REDIS_SERVER_HOST=${REDIS_HOST:?Variable is not set}
      # - REDIS_SERVER_PORT=${REDIS_PORT:?Variable is not set}
      # - REDIS_SERVER_DB=${ONLYOFFICE_REDIS_DB:?Variable is not set}
      # - REDIS_SERVER_PASS=${REDIS_PASSWORD:?Variable is not set}
      - AMQP_URI=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}
    stdin_open: true
    stop_grace_period: 60s
    volumes:
      - ${BASE_STORAGE_DIR:?Variable is not set}/onlyoffice/logs:/var/log/onlyoffice
      - ${BASE_STORAGE_DIR:?Variable is not set}/onlyoffice/data:/var/www/onlyoffice/Data
      - ${BASE_STORAGE_DIR:?Variable is not set}/onlyoffice/lib:/var/lib/onlyoffice
      - ${BASE_STORAGE_DIR:?Variable is not set}/onlyoffice/examples:/var/www/onlyoffice/documentserver-example/public/files
      - ${BASE_STORAGE_DIR:?Variable is not set}/onlyoffice/fonts:/usr/share/fonts
      - ${BASE_STORAGE_DIR:?Variable is not set}/onlyoffice/caches:/var/lib/onlyoffice/documentserver/App_Data/cache/files
      - ${BASE_STORAGE_DIR:?Variable is not set}/onlyoffice/local.json:/etc/onlyoffice/documentserver/local.dist.json
    
    # The following labels are used by the Caddy Proxy to automatically configure reverse proxying to this service.
    # not needed if Caddy is used as a standalone reverse proxy with a static Caddyfile configuration
    #labels:
    #   caddy: ${SERVER_PROTOCOL:?Variable is not set}://${ONLYOFFICE_SERVER_HOSTNAME:?Variable is not set or empty}
    #   caddy.reverse_proxy: "{{upstreams 80}}"
      # only for localhost domain names, like collabora.self.test
      # because they cannot be accessed by other containers without extra_hosts configuration. 
      # real domain names resolve to the host machine's IP address, you can comment out the caddy.tls label.
    #   caddy.tls: "internal"
    # extra_hosts:
    #   - "${SEAFILE_SERVER_HOSTNAME:?Variable is not set}:host-gateway"
    #   - "${ONLYOFFICE_SERVER_HOSTNAME:?Variable is not set}:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/hosting/discovery"]
    networks:
      - docker_net

networks:
  docker_net:
    external: true
